services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplebank}
      POSTGRES_USER: ${POSTGRES_USER:-simplebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplebank}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-simplebank}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-simplebank}:${POSTGRES_PASSWORD:-simplebank}@db:5432/${POSTGRES_DB:-simplebank}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
