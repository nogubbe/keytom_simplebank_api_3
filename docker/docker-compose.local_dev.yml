services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplebank}
      POSTGRES_USER: ${POSTGRES_USER:-simplebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplebank}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-simplebank}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
