name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: '0.9.7'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: simplebank.settings.environments.local
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://simplebank:simplebank@localhost:5432/simplebank
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy .

  django-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: simplebank.settings.environments.local
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://simplebank:simplebank@localhost:5432/simplebank
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run manage.py check

      - name: manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: simplebank.settings.environments.prod
          SECRET_KEY: ci-dummy-secret-key-for-deploy-check-only
          DEBUG: 'False'
          ALLOWED_HOSTS: example.com
        run: uv run manage.py check --deploy

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: simplebank
          POSTGRES_USER: simplebank
          POSTGRES_PASSWORD: simplebank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplebank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: simplebank.settings.environments.local
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://simplebank:simplebank@localhost:5432/simplebank
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: simplebank
          POSTGRES_USER: simplebank
          POSTGRES_PASSWORD: simplebank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplebank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: simplebank.settings.environments.local
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://simplebank:simplebank@localhost:5432/simplebank
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
